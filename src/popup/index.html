<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Memorize</title>
  </head>
  <body>
    <main id="app">
      <h1>Memorize</h1>
      <p id="selection" class="muted">Recherche de la sélection…</p>
      <div class="language-grid">
        <label
          >Source
          <input id="source" value="en" maxlength="10" autocomplete="off"
        /></label>
        <label
          >Cible
          <input id="target" value="fr" maxlength="10" autocomplete="off"
        /></label>
      </div>
      <button id="translate">Traduire et mémoriser</button>
      <p id="translation" class="translation" aria-live="polite"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="vocabulary-title">
        <h2 id="vocabulary-title">Vocabulaire récent</h2>
        <ul id="vocabulary" class="items"></ul>
      </section>
      <section aria-labelledby="history-title">
        <div class="section-heading">
          <h2 id="history-title">Historique</h2>
          <button id="clear-history" class="secondary">Vider</button>
        </div>
        <ul id="history" class="items"></ul>
      </section>
      <button id="save-preferences" class="secondary">
        Enregistrer les préférences
      </button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
