<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Memorize</title>
  </head>
  <body>
    <main id="app">
      <h1>Memorize</h1>
      <p id="selection" class="muted">Recherche de la sélection…</p>
      <div class="language-grid">
        <label
          >Source
          <input id="source" value="en" maxlength="10" autocomplete="off"
        /></label>
        <label
          >Cible
          <input id="target" value="fr" maxlength="10" autocomplete="off"
        /></label>
      </div>
      <button id="translate">Traduire</button>
      <p id="translation" class="translation" aria-live="polite"></p>
      <p id="translation-count" class="muted" aria-live="polite"></p>
      <button id="memorize" disabled>Mémoriser cette traduction</button>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="folders-title">
        <h2 id="folders-title">Dossiers</h2>
        <div id="folder-tree" class="folder-tree" role="tree"></div>
        <label
          >Nouveau dossier
          <input id="new-folder-name" maxlength="80" autocomplete="off"
        /></label>
        <label
          >Dossier parent
          <select id="new-folder-parent"></select
        ></label>
        <button id="add-folder" class="secondary">Créer le dossier</button>
        <div class="folder-actions">
          <label
            >Renommer le dossier sélectionné
            <input id="folder-rename" maxlength="80" autocomplete="off"
          /></label>
          <button id="rename-folder" class="secondary">Renommer</button>
          <button id="delete-folder" class="danger">
            Supprimer le dossier
          </button>
        </div>
      </section>
      <section aria-labelledby="vocabulary-title">
        <h2 id="vocabulary-title">Vocabulaire récent</h2>
        <ul id="vocabulary" class="items"></ul>
      </section>
      <section aria-labelledby="history-title">
        <div class="section-heading">
          <h2 id="history-title">Historique</h2>
          <button id="clear-history" class="secondary">Vider</button>
        </div>
        <ul id="history" class="items"></ul>
      </section>
      <button id="save-preferences" class="secondary">
        Enregistrer les préférences
      </button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
